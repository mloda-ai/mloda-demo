name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run tox
        run: tox
        timeout-minutes: 10

  # tox installs the credit-risk extra, so it cannot notice a PyTorch import in the Physical AI demo.
  physical-ai-light:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync without extras
        run: uv sync --locked

      - name: PyTorch is not installed
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"

      - name: Physical AI tests
        run: uv run --no-sync --with pytest pytest tests/unit/physical_ai tests/integration/physical_ai tests/unit/one_process tests/integration/one_process
        timeout-minutes: 10
