<style>
  @page { size: 1920px 1080px; margin: 0; }
  html, body { margin: 0; }
  body {
    font-family: var(--mloda-sans);
    color: var(--mloda-ink);
    background: var(--mloda-page);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .slide {
    position: relative;
    box-sizing: border-box;
    width: 1920px;
    height: 1080px;
    padding: 56px;
    overflow: hidden;
    break-after: page;
  }
  .slide:last-child { break-after: auto; }
  .panel {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    height: 100%;
    padding: 0 160px;
    border-radius: 24px;
    background: var(--mloda-panel);
    color: var(--mloda-on-dark);
  }
  h1 {
    margin: 0;
    font-size: 124px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.04;
  }
  code { font-family: var(--mloda-mono); font-weight: 400; letter-spacing: 0; }
  .panel code { color: var(--mloda-green); }
  .close { display: grid; grid-template-columns: 1fr 520px; gap: 96px; align-items: center; padding: 120px 136px; }
  .close h2 { margin: 0; font-size: 84px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; text-wrap: balance; }
  .chips { display: flex; flex-wrap: wrap; gap: 16px; margin: 40px 0 56px; }
  .chip {
    padding: 14px 24px;
    border: 1px solid rgba(15, 23, 32, .12);
    border-radius: 8px;
    background: var(--mloda-card);
    font-family: var(--mloda-mono);
    font-size: 40px;
  }
  .close p { margin: 0; font-size: 56px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; color: var(--mloda-green-strong); }
  .card { padding: 40px; border-radius: 16px; background: var(--mloda-card); text-align: center; }
  .card svg { display: block; width: 440px; height: 440px; border-radius: 8px; }
  .card span { display: block; margin-top: 24px; font-family: var(--mloda-mono); font-size: 23px; white-space: nowrap; }
  .wordmark { position: absolute; left: 136px; bottom: 72px; width: 221px; height: 96px; color: var(--mloda-ink); }
</style>
</head>
